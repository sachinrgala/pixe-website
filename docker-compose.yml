version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

  # Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-} # Priority for Nile/Prod
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-pixe_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-} # SECURITY: Set via env
      - DB_NAME=${POSTGRES_DB:-pixe_db}
      - DB_PORT=5432
    depends_on:
      - postgres
      - redis

  # Python AI Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models

  # PostgreSQL - SECURITY: Internal network only
  postgres:
    image: postgres:15-alpine
    # SECURITY: No public port exposure - internal only
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-pixe_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      - POSTGRES_DB=${POSTGRES_DB:-pixe_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis - SECURITY: Internal network only with password
  redis:
    image: redis:7-alpine
    # SECURITY: No public port exposure - internal only  
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

