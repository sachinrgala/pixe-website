name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    name: Test Go Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Verify Dependencies
        working-directory: ./backend
        run: go mod verify
      - name: Run Tests
        working-directory: ./backend
        run: go test -v ./...

  test-frontend:
    name: Test Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint
        working-directory: ./frontend
        run: npm run lint
      - name: Build Check
        working-directory: ./frontend
        run: npm run build

  test-ai-service:
    name: Test Python AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Tests (Placeholder)
        working-directory: ./ai-service
        run: |
          # Add actual tests here (e.g., pytest)
          python -c "import main; print('Import check passed')"

  build-containers:
    name: Build Docker Images
    needs: [test-backend, test-frontend, test-ai-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: pixe-backend:latest
      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: pixe-frontend:latest
      - name: Build AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: pixe-ai-service:latest
