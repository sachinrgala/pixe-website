name: CD Pipeline - Hostinger VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [] # In a real scenario, this should need 'ci' workflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Note: Configuring Docker Registry & SSH Secrets is required for this to work
      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: Build and Push Images
      #   uses: docker/build-push-action@v5
      #   ...

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_IP }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd /path/to/app
            git pull origin main
            # If using Nile DB, ensure DATABASE_URL is set in .env on the server
            docker-compose pull
            docker-compose up -d --build --remove-orphans
